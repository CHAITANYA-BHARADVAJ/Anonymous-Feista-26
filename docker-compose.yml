services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campushunt_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/data/dev.db
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (e.g. openssl rand -hex 32)}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD in .env (>= 8 chars)}
      - CLIENT_URL=https://${DOMAIN:-localhost}
      - FORCE_SEED=${FORCE_SEED:-false}
    volumes:
      - ./data:/data
      - ./uploads:/app/packages/server/uploads
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - hunt-net

  caddy:
    image: caddy:2-alpine
    container_name: campushunt_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@anonymoussdmcet.in}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - hunt-net

volumes:
  caddy_data:
  caddy_config:

networks:
  hunt-net:
    driver: bridge
